<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IME Cosmópolis - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 30px 15px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 35px 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .header-dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .header-dashboard img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      color: #1a1a2e;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .btn-cadastro {
      display: block;
      width: fit-content;
      margin: 20px auto;
      padding: 12px 25px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-cadastro:hover {
      background: #357ABD;
    }

    .loading-message {
      text-align: center;
      font-size: 1.1rem;
      color: #555;
      margin-top: 30px;
    }

    .members-table-container {
      margin-top: 30px;
      overflow-x: auto; /* Permite rolagem horizontal em telas pequenas */
    }

    .members-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-radius: 8px;
    }

    .members-table th,
    .members-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .members-table th {
      background: #f8f8f8;
      color: #1a1a2e;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .members-table tr:last-child td {
      border-bottom: none;
    }

    .members-table tbody tr:hover {
      background: #f5f5f5;
    }

    .members-table .btn-editar {
      padding: 6px 12px;
      background: #28a745; /* Verde */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .members-table .btn-editar:hover {
      background: #218838;
    }

    .no-members-message {
      text-align: center;
      color: #777;
      font-size: 1.1rem;
      margin-top: 40px;
      padding: 20px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      background: #fdfdfd;
    }

    @media (max-width: 768px) {
      .container { padding: 25px 20px; }
      .members-table th, .members-table td {
        padding: 10px;
        font-size: 0.9rem;
      }
      .members-table .btn-editar {
        padding: 5px 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header-dashboard">
    <img src="logo.png" alt="Logo IME Cosmópolis" />
    <h1>Dashboard de Membros</h1>
  </div>
  <p class="subtitulo">Gerencie os membros da IME Cosmópolis</p>

  <a href="cadastro.html" class="btn-cadastro">Novo Cadastro</a>

  <div class="members-table-container">
    <p id="loadingMessage" class="loading-message">Carregando membros...</p>
    <div id="membersList">
      <!-- A lista de membros será carregada aqui -->
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJlvtd8nMHJ74s9fnf9nXjKIAFls4E-eY",
    authDomain: "imes-membros.firebaseapp.com",
    projectId: "imes-membros",
    storageBucket: "imes-membros.firebasestorage.app",
    messagingSenderId: "101731280105",
    appId: "1:101731280105:web:de733e85d71a8aedaf3c78"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function carregarMembros() {
    const loadingMessage = document.getElementById('loadingMessage');
    const membersListDiv = document.getElementById('membersList');
    membersListDiv.innerHTML = ''; // Limpa a lista antes de carregar

    try {
      const membrosCollection = collection(db, 'membros');
      const querySnapshot = await getDocs(membrosCollection);

      if (querySnapshot.empty) {
        membersListDiv.innerHTML = '<p class="no-members-message">Nenhum membro cadastrado ainda.</p>';
        loadingMessage.style.display = 'none';
        return;
      }

      let tableHTML = `
        <table class="members-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
      `;

      querySnapshot.forEach((doc) => {
        const membro = doc.data();
        const membroId = doc.id; // ID do documento no Firestore
        tableHTML += `
          <tr>
            <td>${membro.nome || 'N/A'}</td>
            <td>${membro.email || 'N/A'}</td>
            <td>${membro.telefone || 'N/A'}</td>
            <td>${membro.status || 'N/A'}</td>
            <td>
              <button class="btn-editar" onclick="editarMembro('${membroId}')">Editar</button>
            </td>
          </tr>
        `;
      });

      tableHTML += `
          </tbody>
        </table>
      `;
      membersListDiv.innerHTML = tableHTML;
      loadingMessage.style.display = 'none';

    } catch (e) {
      console.error("Erro ao carregar membros: ", e);
      membersListDiv.innerHTML = '<p class="no-members-message" style="color: red;">Erro ao carregar membros. Verifique sua conexão ou tente novamente.</p>';
      loadingMessage.style.display = 'none';
    }
  }

  // Esta função será implementada na próxima etapa
  window.editarMembro = function(id) {
    alert('Você clicou em editar o membro com ID: ' + id);
    // Aqui vamos redirecionar para uma página de edição ou abrir um modal
  };

  // Carrega os membros quando a página é carregada
  document.addEventListener('DOMContentLoaded', carregarMembros);
</script>
</body>
</html>
