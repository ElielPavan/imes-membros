<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IME Cosmópolis - Cadastro de Membros</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    /* Estilos existentes */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; padding: 20px 15px; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 30px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
    .header img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 15px; }
    h1 { text-align: center; color: #1a1a2e; font-size: 1.8rem; margin-bottom: 8px; }
    .subtitulo { text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 0.9rem; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="number"], select, textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2); outline: none;
    }
    textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .checkbox-group { display: flex; align-items: center; margin-top: 10px; }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; margin-right: 10px; cursor: pointer; }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .btn-submit {
      display: block; width: 100%; padding: 14px; background: #4a90e2; color: #fff;
      border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.2s; margin-top: 25px;
    }
    .btn-submit:hover { background: #357ABD; transform: translateY(-2px); }
    .btn-submit:active { transform: translateY(0); }
    .message { padding: 12px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: 600; }
    .message.sucesso { background: #e6ffe6; color: #28a745; border: 1px solid #28a745; }
    .message.erro { background: #ffe6e6; color: #dc3545; border: 1px solid #dc3545; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    .spinner { border: 4px solid rgba(0, 0, 0, 0.1); border-top: 4px solid #4a90e2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { color: #4a90e2; font-weight: 600; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Carregando...</div>
  </div>

  <div class="container">
    <div class="header">
      <img src="https://i.imgur.com/2Y4Y0Zq.png" alt="Logo IME" />
      <h1 id="form-title">Cadastro de Membros</h1>
      <p class="subtitulo">Preencha os dados para se tornar um membro da IME Cosmópolis</p>
    </div>

    <form id="cadastro-form">
      <input type="hidden" id="member-id" />

      <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nascimento">Data de Nascimento *</label>
          <input type="date" id="nascimento" required />
        </div>
        <div class="form-group">
          <label for="telefone">Telefone (WhatsApp) *</label>
          <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" placeholder="XXX.XXX.XXX-XX" required />
        </div>
      </div>

      <div class="form-group">
        <label for="endereco">Endereço Completo *</label>
        <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Cidade - Estado" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" required>
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Pendente">Pendente</option>
          </select>
        </div>
        <div class="form-group">
          <label for="funcao">Função na Igreja *</label>
          <select id="funcao" required>
            <option value="Membro">Membro</option>
            <option value="Líder">Líder</option>
            <option value="Pastor">Pastor</option>
            <option value="Diácono">Diácono</option>
            <option value="Missionário">Missionário</option>
            <option value="Voluntário">Voluntário</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="membroDesde">Membro Desde</label>
          <input type="date" id="membroDesde" />
        </div>
        <div class="form-group">
          <label for="igrejaOrigem">Igreja de Origem</label>
          <input type="text" id="igrejaOrigem" placeholder="Nome da igreja anterior (se houver)" />
        </div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="participouCafe" />
          <label for="participouCafe">Participou do último Café com o Pastor?</label>
        </div>
      </div>

      <div class="form-group">
        <label for="obs">Observações</label>
        <textarea id="obs" placeholder="Informações adicionais sobre o membro..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Enviar Cadastro</button>
      <div id="message-area"></div>
    </form>
  </div>

  <script>
    // IMPORTANTE: Ao copiar este código, certifique-se de que NENHUMA QUEBRA DE LINHA
    // seja introduzida dentro das expressões regulares (os trechos entre `/` e `/`).
    // Elas devem ser escritas em uma única linha contínua.
    // Se o erro "SyntaxError: Invalid regular expression: missing /" persistir,
    // o problema é que seu editor ou o processo de cópia/colagem está inserindo
    // quebras de linha indevidas. Verifique o arquivo RAW no GitHub após o upload.

    // Configuração do Firebase (substitua pelas suas credenciais do projeto de MEMBROS)
    const firebaseConfig = {
      apiKey: "AIzaSyDwqgDPPKkLHaFE91pElosk9yxbm944VXE", // Use a API Key do seu projeto de MEMBROS
      authDomain: "ime-financeiro.firebaseapp.com", // Use o Auth Domain do seu projeto de MEMBROS
      projectId: "ime-financeiro", // Use o Project ID do seu projeto de MEMBROS
      storageBucket: "ime-financeiro.firebasestorage.app", // Use o Storage Bucket do seu projeto de MEMBROS
      messagingSenderId: "282996773999", // Use o Messaging Sender ID do seu projeto de MEMBROS
      appId: "1:282996773999:web:beb74f22dc64d55e41e99a" // Use o App ID do seu projeto de MEMBROS
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Elementos do DOM
    const form = document.getElementById('cadastro-form');
    const memberIdInput = document.getElementById('member-id');
    const formTitle = document.getElementById('form-title');
    const btnSubmit = document.getElementById('btn-submit');
    const messageArea = document.getElementById('message-area');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    // Campos do formulário
    const nomeInput = document.getElementById('nome');
    const nascimentoInput = document.getElementById('nascimento');
    const telefoneInput = document.getElementById('telefone');
    const emailInput = document.getElementById('email');
    const cpfInput = document.getElementById('cpf');
    const enderecoInput = document.getElementById('endereco');
    const statusSelect = document.getElementById('status');
    const funcaoSelect = document.getElementById('funcao');
    const membroDesdeInput = document.getElementById('membroDesde');
    const igrejaOrigemInput = document.getElementById('igrejaOrigem');
    const participouCafeCheckbox = document.getElementById('participouCafe');
    const obsTextarea = document.getElementById('obs');

    // Função para formatar CPF
    function formatarCPF(cpf) {
      cpf = cpf.replace(/\D/g, ''); // Remove tudo o que não é dígito
      if (cpf.length > 11) cpf = cpf.substring(0, 11);
      cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
      cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
      // CORREÇÃO: Esta linha deve ser contínua, sem quebras de linha dentro do / /
      cpf = cpf.replace(/(\d{3})(\d{1,2})
$
/, '$1-$2');
      return cpf;
    }

    // Função para formatar Telefone
    function formatarTelefone(tel) {
      tel = tel.replace(/\D/g, ''); // Remove tudo o que não é dígito
      if (tel.length > 11) tel = tel.substring(0, 11);
      if (tel.length > 10) {
        // CORREÇÃO: Esta linha deve ser contínua, sem quebras de linha dentro do / /
        tel = tel.replace(/
^
(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
      } else if (tel.length > 6) {
        // CORREÇÃO: Esta linha deve ser contínua, sem quebras de linha dentro do / /
        tel = tel.replace(/
^
(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
      } else if (tel.length > 2) {
        // CORREÇÃO: Esta linha deve ser contínua, sem quebras de linha dentro do / /
        tel = tel.replace(/
^
(\d\d)(\d{0,5}).*/, '($1) $2');
      } else {
        // CORREÇÃO: Esta linha deve ser contínua, sem quebras de linha dentro do / /
        tel = tel.replace(/
^
(\d*)/, '($1');
      }
      return tel;
    }

    // Adiciona listeners para formatação
    cpfInput.addEventListener('input', (e) => {
      e.target.value = formatarCPF(e.target.value);
    });
    telefoneInput.addEventListener('input', (e) => {
      e.target.value = formatarTelefone(e.target.value);
    });

    // Função para exibir mensagens
    function mostrarMsg(msg, tipo) {
      messageArea.innerHTML = `<div class="message ${tipo}">${msg}</div>`;
      setTimeout(() => {
        messageArea.innerHTML = '';
      }, 5000);
    }

    // Função para limpar o formulário
    function limparFormulario() {
      form.reset(); // Reseta todos os campos do formulário
      memberIdInput.value = '';
      formTitle.textContent = 'Cadastro de Membros';
      btnSubmit.textContent = 'Enviar Cadastro';
      // Garante que o checkbox de café seja desmarcado para novos cadastros
      participouCafeCheckbox.checked = false;
    }

    // Função para carregar dados de um membro para edição
    async function carregarMembroParaEdicao(id) {
      loadingText.textContent = 'Carregando dados do membro...';
      loadingOverlay.style.display = 'flex';
      try {
        const docRef = db.collection('membros').doc(id);
        const doc = await docRef.get();

        if (doc.exists) {
          const membro = doc.data();
          memberIdInput.value = id;
          formTitle.textContent = 'Editar Cadastro de Membro';
          btnSubmit.textContent = 'Atualizar Cadastro';

          nomeInput.value = membro.nome || '';
          nascimentoInput.value = membro.nascimento || '';
          telefoneInput.value = membro.telefone || '';
          emailInput.value = membro.email || '';
          cpfInput.value = membro.cpf || '';
          enderecoInput.value = membro.endereco || '';
          statusSelect.value = membro.status || 'Ativo';
          funcaoSelect.value = membro.funcao || 'Membro';
          membroDesdeInput.value = membro.membroDesde || '';
          igrejaOrigemInput.value = membro.igrejaOrigem || '';
          participouCafeCheckbox.checked = membro.participouCafe || false;
          obsTextarea.value = membro.obs || '';
        } else {
          mostrarMsg('Membro não encontrado para edição.', 'erro');
          limparFormulario();
        }
      } catch (e) {
        mostrarMsg('Erro ao carregar dados do membro.', 'erro');
        console.error(e);
      } finally {
        loadingOverlay.style.display = 'none';
      }
    }

    // Função principal de salvar/atualizar membro
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loadingText.textContent = 'Salvando cadastro...';
      loadingOverlay.style.display = 'flex';

      const id = memberIdInput.value;
      const dados = {
        nome: nomeInput.value.trim(),
        nascimento: nascimentoInput.value,
        telefone: telefoneInput.value.trim(),
        email: emailInput.value.trim().toLowerCase(),
        cpf: cpfInput.value.trim(),
        endereco: enderecoInput.value.trim(),
        status: statusSelect.value,
        funcao: funcaoSelect.value,
        membroDesde: membroDesdeInput.value,
        igrejaOrigem: igrejaOrigemInput.value.trim(),
        participouCafe: participouCafeCheckbox.checked,
        dataCafe: participouCafeCheckbox.checked ? new Date().toISOString().split('T')[0] : null,
        obs: obsTextarea.value.trim(),
        dataCadastro: id ? dados.dataCadastro : new Date().toISOString().split('T')[0] // Mantém data de cadastro em edição
      };

      // Validação básica
      if (!dados.nome || !dados.nascimento || !dados.telefone || !dados.email || !dados.cpf || !dados.endereco) {
        mostrarMsg('Por favor, preencha todos os campos obrigatórios (*).', 'erro');
        loadingOverlay.style.display = 'none';
        return;
      }

      try {
        // Verificação de duplicidade (apenas para novos cadastros ou se e-mail/cpf for alterado em edição)
        const querySnapshotEmail = await db.collection('membros').where('email', '==', dados.email).get();
        const querySnapshotCpf = await db.collection('membros').where('cpf', '==', dados.cpf).get();

        let isDuplicate = false;
        if (id) { // Edição
          // Verifica se o e-mail ou CPF já existe em OUTRO membro
          if (querySnapshotEmail.docs.some(doc => doc.id !== id)) {
            isDuplicate = true;
            mostrarMsg('Erro: Este e-mail já está cadastrado em outro membro.', 'erro');
          }
          if (!isDuplicate && querySnapshotCpf.docs.some(doc => doc.id !== id)) {
            isDuplicate = true;
            mostrarMsg('Erro: Este CPF já está cadastrado em outro membro.', 'erro');
          }
        } else { // Novo cadastro
          if (!querySnapshotEmail.empty) {
            isDuplicate = true;
            mostrarMsg('Erro: Este e-mail já está cadastrado.', 'erro');
          }
          if (!isDuplicate && !querySnapshotCpf.empty) {
            isDuplicate = true;
            mostrarMsg('Erro: Este CPF já está cadastrado.', 'erro');
          }
        }

        if (isDuplicate) {
          loadingOverlay.style.display = 'none';
          return;
        }

        if (id) {
          // Atualizar membro existente
          await db.collection('membros').doc(id).update(dados);
          mostrarMsg('✅ Cadastro atualizado com sucesso!', 'sucesso');
          // Após a edição, pode ser útil redirecionar para o dashboard de membros
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          // Adicionar novo membro
          await db.collection('membros').add(dados);
          mostrarMsg('✅ Cadastro realizado com sucesso! Seja bem-vindo à IME Cosmópolis!', 'sucesso');
          limparFormulario(); // Limpa o formulário para um novo cadastro
          window.scrollTo({ top: 0, behavior: 'smooth' });
          // NENHUM REDIRECIONAMENTO AQUI para novos cadastros
        }
      } catch (e) {
        mostrarMsg('Erro ao enviar cadastro. Tente novamente.', 'erro');
        console.error(e);
      } finally {
        loadingOverlay.style.display = 'none';
      }
    });

    // Inicialização: Verifica se é uma edição ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = urlParams.get('id');
      if (memberId) {
        carregarMembroParaEdicao(memberId);
      } else {
        limparFormulario(); // Garante que o formulário esteja limpo para um novo cadastro
      }
    });
  </script>
</body>
</html>
